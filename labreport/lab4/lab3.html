<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Book Loader</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        #display { margin-top: 20px; }
        button { padding: 10px 20px; background: #007bff; color: white; border: none; cursor: pointer; }
    </style>
</head>
<body>

    <h1>Load XML Data via XSLT</h1>
    <button onclick="displayResult()">Load Book Table</button>
    <div id="display"></div>

    <script>
    function loadFile(url) {
        var xhttp = new XMLHttpRequest();
        xhttp.open("GET", url, false);
        xhttp.send("");
        return xhttp.responseXML;
    }

    function displayResult() {
        var xml = loadFile("lab3.xml");
        var xsl = loadFile("lab3.xsl");

        // Code for Chrome, Firefox, Edge, etc.
        if (window.XSLTProcessor) {
            var xsltProcessor = new XSLTProcessor();
            xsltProcessor.importStylesheet(xsl);
            var resultDocument = xsltProcessor.transformToFragment(xml, document);
            document.getElementById("display").innerHTML = "";
            document.getElementById("display").appendChild(resultDocument);
        }
    }
    </script>

</body>
</html>
