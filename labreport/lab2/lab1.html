<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alert message demo</title>
</head>
<body>

    <!-- The button that triggers the alert -->
    <button onclick="showAlert()">Click Me!</button>

    <script>
        // The JavaScript function that shows the alert
        function showAlert(){
            alert("BUTTON CLICKED!");
        }
    </script>
</body>
</html>
