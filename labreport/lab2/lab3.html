<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Current DateTime</title>
</head>
<body>
    
    <!-- HTML goes outside the script tag -->
    <h1>Current Date and Time</h1>
    
    <!-- An empty paragraph where the date will be displayed -->
    <p id="timeDisplay"></p>

    <script>
        // Get the current date and time
        let currentDateTime = new Date();
        
        // Find the paragraph element and put the date inside it
        document.getElementById("timeDisplay").innerText = "Current Date and Time: " + currentDateTime;
    </script>

</body>
</html>
