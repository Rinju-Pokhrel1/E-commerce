<!-- 11) Write a script to illustrate the concept of chaining using the slideUp and
slideDown method. -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>chaining</title>
</head>
<body>
    <h1>Chaining Example</h1>
    <button id="toggle">Toggle Slide</button>
    <div id="box" style="width:100px; height:100px; background-color:blue; margin-top:20px;"></div>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script>
        $(document).ready(function() {
            $('#toggle').click(function() {
                $('#box').slideUp(1000).slideDown(1000);
            });
        });
    </script>
</body>
</html>
