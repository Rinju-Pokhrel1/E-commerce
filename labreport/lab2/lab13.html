<!-- 13) Create a button that sequentially animates the width, height, and
opacity of a <div> element when clicked. -->

    <!DOCTYPE html>
    <html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Animation</title>
    </head>
    <body>
        <h1>Sequential Animation Example</h1>
        <button id="animate">Animate</button>   
        <div id="box" style="width:100px; height:100px; background-color:green; margin-top:20px;"></div>
        <script src="https://code.jquery.com/jquery-3.6.0.min.js "></script>
        <script>
            $(document).ready(function() {  
                $('#animate').click(function() {
                    $('#box').animate({width: '200px'}, 1000)
                             .animate({height: '200px'}, 1000)
                             .animate({opacity: 0.5}, 1000);
                });
            });
        </script>   
    </body>
    </html>
