<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Form Example</title>
</head>

<body>

    <form action="lab3.php" method="post">
        <label>Name:</label>
        <input type="text" name="name"><br><br>

        <label>Gender:</label>

        <input type="radio" name="gender" id="male" value="Male">
        <label for="male">Male</label>

        <input type="radio" name="gender" id="female" value="Female">
        <label for="female">Female</label>
<br><br>
        <!-- Better labeling for checkboxes -->
        <label>Hobbies:</label>
        <input type="checkbox" name="hobbies[]" id="read" value="Reading"> <label for="read">Reading</label>
        <input type="checkbox" name="hobbies[]" id="travel" value="Traveling"> <label for="travel">Traveling</label>
        <br><br>
        <label>Country:</label>
        <select name="country">
            <option value="USA">USA</option>
            <option value="Canada">Canada</option>
            <option value="Nepal">Nepal</option>
        </select>
        <br><br>

        <input type="submit" value="Submit">
    </form>

</body>

</html>
